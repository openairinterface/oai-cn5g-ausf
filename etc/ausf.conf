## AUSF configuration file
AUSF = 
{
  INSTANCE_ID = 10; #10
  PID_DIRECTORY = "/var/run";
  AUSF_NAME = "OAI-AUSF";

  #STATISTICS_TIMER_INTERVAL = 20; #second

  INTERFACES:{
    # AUSF binded interface for SBI interface (e.g., communication with AMF, UDM)
    SBI_AUSF:{    
        INTERFACE_NAME = "eth0";          # YOUR NETWORK CONFIG HERE
        IPV4_ADDRESS   = "read";      
        PORT           = 8383;            # YOUR NETWORK CONFIG HERE (default: 80)
        PPID           = 60;
    };
  };   
    
  # UDM Information        
  UDM:{
     IPV4_ADDRESS   = "192.168.1.23/24";  # YOUR NETWORK CONFIG HERE
     PORT           = 80;                 # YOUR NETWORK CONFIG HERE  (default: 80)
     API_VERSION    = "v1";               # YOUR AMF API VERSION FOR UDM CONFIG HERE
    };
    
  # AMF Information  
  AMF:{
     IPV4_ADDRESS   = "192.168.1.23/24";  # YOUR NETWORK CONFIG HERE  (default: 80)
     PORT           = 80;                 # YOUR NETWORK CONFIG HERE  (default: 80)
     API_VERSION    = "v1";               # YOUR AMF API VERSION FOR UDM CONFIG HERE
    };

};


