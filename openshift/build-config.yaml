kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: "ausf-build-cfg"
  namespace: oaicicd-core
spec:
    runPolicy: "Serial"
    source:
        type: "Binary"
    strategy:
        dockerStrategy:
            dockerfilePath: "docker/Dockerfile.ausf.centos"
    output:
        to:
            kind: "ImageStreamTag"
            name: "oai-ausf:latest"
